<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Circle Radial Gradient -->
    <radialGradient id="bgGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#5a1570"/>
      <stop offset="60%" stop-color="#460f58"/>
      <stop offset="100%" stop-color="#350b43"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="flowerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Clip Path for the Circle -->
  <clipPath id="circleClip">
    <circle cx="256" cy="256" r="256" />
  </clipPath>

  <g clip-path="url(#circleClip)">
    <!-- Base background -->
    <rect width="512" height="512" fill="url(#bgGrad)" />

    <!-- Watermark Thai Letters in background -->
    <g fill="#ffffff" fill-opacity="0.04" font-family="'Noto Sans Thai', sans-serif" font-weight="900">
      <text x="40" y="80" font-size="52" transform="rotate(-15 40 80)">ก</text>
      <text x="140" y="60" font-size="44" transform="rotate(10 140 60)">ข</text>
      <text x="240" y="85" font-size="50" transform="rotate(-8 240 85)">ด</text>
      <text x="360" y="70" font-size="56" transform="rotate(15 360 70)">น</text>
      <text x="430" y="140" font-size="46" transform="rotate(-20 430 140)">ม</text>
      <text x="40" y="190" font-size="48" transform="rotate(20 40 190)">ร</text>
      <text x="450" y="240" font-size="54" transform="rotate(8 450 240)">ว</text>
      <text x="400" y="340" font-size="50" transform="rotate(-15 400 340)">ส</text>
      <text x="40" y="320" font-size="52" transform="rotate(-12 40 320)">ห</text>
      <text x="80" y="440" font-size="46" transform="rotate(18 80 440)">อ</text>
      <text x="180" y="460" font-size="52" transform="rotate(-5 180 460)">ย</text>
      <text x="300" y="450" font-size="50" transform="rotate(12 300 450)">พ</text>
      <text x="420" y="430" font-size="48" transform="rotate(-10 420 430)">บ</text>
    </g>

    <!-- Main Yellow Calligraphy "သူဇာ" (ThaiSar school Burmese brand lettering) -->
    <g filter="url(#shadow)">
      <!-- Yellow stylized Burmese curves -->
      <path d="M 95 275 
               C 80 250, 75 220, 105 205 
               C 135 190, 155 210, 155 235
               C 155 250, 145 265, 130 270
               C 145 272, 165 260, 175 235
               C 185 205, 160 175, 125 180
               C 85 185, 60 225, 75 270
               C 85 300, 110 305, 130 295
               C 135 320, 135 345, 134 370
               C 133 385, 140 395, 155 390
               C 165 385, 170 375, 158 372
               C 148 370, 146 360, 146 345
               C 146 325, 148 305, 144 285
               C 125 292, 105 290, 95 275 Z" fill="#fff000" />

      <!-- Center characters "ဇာ" and vowel flourishing tail -->
      <path d="M 210 270
               C 195 250, 195 225, 215 205
               C 235 185, 260 190, 265 215
               C 270 240, 255 260, 240 262
               C 255 265, 275 250, 280 230
               C 285 205, 270 175, 240 175
               C 200 175, 175 215, 185 260
               C 192 290, 215 300, 240 295
               C 260 290, 275 270, 275 250
               C 275 240, 265 240, 260 248
               C 255 260, 242 275, 225 275
               C 218 275, 213 273, 210 270 Z" fill="#fff000" />

      <!-- Rising tall plume accent above center -->
      <path d="M 270 215
               C 265 180, 270 150, 278 120
               C 282 105, 286 95, 292 85
               C 290 100, 284 118, 276 135
               C 268 152, 264 175, 272 195
               C 275 202, 278 208, 280 215
               C 276 216, 273 216, 270 215 Z" fill="#fff000" />

      <!-- Second loop / "ဇ" / "ာ" arches -->
      <path d="M 315 270
               C 300 245, 305 215, 330 205
               C 355 195, 375 215, 370 240
               C 365 260, 350 270, 335 270
               C 350 272, 370 260, 375 240
               C 380 210, 360 185, 330 185
               C 295 185, 280 220, 290 260
               C 298 290, 320 300, 345 295
               C 370 290, 385 265, 385 240
               C 385 230, 375 230, 370 238
               C 365 255, 352 275, 330 275
               C 322 275, 317 273, 315 270 Z" fill="#fff000" />

      <!-- End character curve -->
      <path d="M 405 270
               C 390 240, 400 205, 430 200
               C 460 195, 480 225, 470 255
               C 460 285, 435 295, 410 290
               C 430 290, 450 275, 455 255
               C 460 235, 448 215, 430 218
               C 410 222, 405 245, 412 265
               C 416 275, 425 285, 440 282
               C 445 281, 450 285, 448 290
               C 442 305, 420 310, 405 295
               C 398 288, 395 280, 405 270 Z" fill="#fff000" />
    </g>

    <!-- White Plumeria / Frangipani Flower with yellow-orange core on upper-left -->
    <g transform="translate(130, 175) scale(0.9)" filter="url(#flowerGlow)">
      <!-- 5 Petals of frangipani -->
      <!-- Petal 1 (top) -->
      <path d="M 0 0 C -25 -45, -15 -85, 5 -85 C 25 -85, 35 -45, 0 0 Z" fill="#ffffff" stroke="#f2ecde" stroke-width="1.5"/>
      <!-- Petal 2 (top right) -->
      <path d="M 0 0 C 35 -35, 75 -35, 80 -15 C 85 5, 50 35, 0 0 Z" fill="#ffffff" stroke="#f2ecde" stroke-width="1.5"/>
      <!-- Petal 3 (bottom right) -->
      <path d="M 0 0 C 45 15, 65 55, 45 75 C 25 95, -5 65, 0 0 Z" fill="#ffffff" stroke="#f2ecde" stroke-width="1.5"/>
      <!-- Petal 4 (bottom left) -->
      <path d="M 0 0 C -15 45, -55 65, -75 45 C -95 25, -65 -5, 0 0 Z" fill="#ffffff" stroke="#f2ecde" stroke-width="1.5"/>
      <!-- Petal 5 (top left) -->
      <path d="M 0 0 C -45 -15, -75 -45, -60 -70 C -45 -95, -15 -60, 0 0 Z" fill="#ffffff" stroke="#f2ecde" stroke-width="1.5"/>
      <!-- Realistic golden-yellow radiant center -->
      <radialGradient id="flowerCenter" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#ff8c00"/>
        <stop offset="35%" stop-color="#ffb700"/>
        <stop offset="70%" stop-color="#ffea00"/>
        <stop offset="100%" stop-color="#ffea00" stop-opacity="0"/>
      </radialGradient>
      <circle cx="0" cy="0" r="28" fill="url(#flowerCenter)"/>
      <circle cx="0" cy="0" r="8" fill="#ff7700" fill-opacity="0.8"/>
    </g>
  </g>
</svg>